<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>משימה קולית</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      font-size: 20px;
      padding: 18px 30px;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    audio {
      width: 100%;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>הוספת משימה קולית</h1>

  <button id="recordButton">
    🎤 התחל הקלטה
  </button>

  <div id="status">
    מוכן להקלטה
  </div>

  <audio
    id="audioPlayer"
    controls
  ></audio>


  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbwN5A_GYbLvkP4ZbXhcTKcqyxn4kvX-PaFDtqQ2X95Unh5_PP4NQ5pR6Ib9XQdmV_iC/exec";


    const recordButton =
      document.getElementById("recordButton");

    const statusBox =
      document.getElementById("status");

    const audioPlayer =
      document.getElementById("audioPlayer");


    let mediaRecorder;

    let audioChunks = [];

    let isRecording = false;

    let currentStream = null;


    recordButton.addEventListener(
      "click",
      async function () {

        if (!isRecording) {

          try {

            currentStream =
              await navigator.mediaDevices
                .getUserMedia({
                  audio: true
                });


            audioChunks = [];


            mediaRecorder =
              new MediaRecorder(
                currentStream
              );


            mediaRecorder.ondataavailable =
              function (event) {

                if (event.data.size > 0) {
                  audioChunks.push(
                    event.data
                  );
                }

              };


            mediaRecorder.onstop =
              async function () {

                try {

                  statusBox.textContent =
                    "⏳ מכין את ההקלטה...";


                  const audioBlob =
                    new Blob(
                      audioChunks,
                      {
                        type:
                          mediaRecorder.mimeType
                      }
                    );


                  // מאפשר להשמיע את ההקלטה בדף
                  const audioUrl =
                    URL.createObjectURL(
                      audioBlob
                    );

                  audioPlayer.src =
                    audioUrl;


                  // המרה ל-Base64
                  const base64Audio =
                    await blobToBase64(
                      audioBlob
                    );


                  statusBox.textContent =
                    "⏳ שולח לתמלול וליצירת משימה...";


                  await fetch(
                    WEB_APP_URL,
                    {
                      method: "POST",

                      mode: "no-cors",

                      headers: {
                        "Content-Type":
                          "text/plain"
                      },

                      body:
                        JSON.stringify({
                          type: "audio",
                          mimeType:
                            audioBlob.type,
                          audioBase64:
                            base64Audio
                        })
                    }
                  );


                  statusBox.textContent =
                    "✅ ההקלטה נשלחה לעיבוד";


                } catch (error) {

                  console.error(
                    "שגיאה בשליחת ההקלטה:",
                    error
                  );

                  statusBox.textContent =
                    "❌ אירעה שגיאה בשליחת ההקלטה";

                } finally {

                  if (currentStream) {

                    currentStream
                      .getTracks()
                      .forEach(
                        track =>
                          track.stop()
                      );

                    currentStream =
                      null;
                  }

                }

              };


            mediaRecorder.start();


            isRecording = true;


            recordButton.textContent =
              "⏹️ עצור הקלטה";


            statusBox.textContent =
              "🎙️ מקליט...";


          } catch (error) {

            console.error(
              "שגיאת מיקרופון:",
              error
            );


            statusBox.textContent =
              "❌ לא ניתן להפעיל את המיקרופון";

          }


        } else {

          mediaRecorder.stop();

          isRecording = false;


          recordButton.textContent =
            "🎤 התחל הקלטה";

        }

      }
    );


    function blobToBase64(blob) {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          const reader =
            new FileReader();


          reader.onloadend =
            function () {

              const result =
                reader.result;

              const base64 =
                result.split(",")[1];

              resolve(base64);

            };


          reader.onerror =
            function () {

              reject(
                new Error(
                  "לא ניתן לקרוא את קובץ ההקלטה"
                )
              );

            };


          reader.readAsDataURL(
            blob
          );

        }
      );

    }

  </script>

</body>

</html>
